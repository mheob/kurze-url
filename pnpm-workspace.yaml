packages:
  - apps/web
  - packages/*

allowBuilds:
  better-sqlite3: true
  esbuild: true
  lefthook: true
  lightningcss: true
  # No-op here: its postinstall only runs `msw init` when package.json has a
  # `msw.workerDirectory` entry (browser mock service worker setup), which this
  # project doesn't add — only `msw/node`'s setupServer is used in tests.
  msw: true

# `@hey-api/json-schema-ref-parser` pins js-yaml 4.2.0, which carries two high-severity
# advisories (GHSA-52cp-r559-cp3m, GHSA-5p4m-2wfm-xmqj) fixed in 4.3.1. Nothing else in the
# tree is on 4.2.0 — the rest already resolve to 4.3.2 — so this only pulls that one
# dependency forward onto the version everything else uses. Drop it once the parent bumps.
overrides:
  js-yaml@4.2.0: ^4.3.2

# Three days, in minutes: the window the Renovate preset applies to npm
# packages (`security:minimumReleaseAgeNpm`, which
# github>mheob/renovate-config:security extends), so a manual `pnpm add` or
# `pnpm update` holds back what Renovate would. Until 2026-09-25 only the
# exclusion list below existed — an exclusion from a gate nothing had set,
# which pnpm 12's own release notes name as the failure its stricter settings
# check exists to catch. A security fix that is still too fresh is installed
# with `--config.minimum-release-age=0` on that one command rather than through
# a change to this value — but that alone does not get it through CI: pnpm 12
# also checks the lockfile against this gate, so every later frozen install
# refuses the fresh entries until they mature. Those exact versions therefore
# go into the exclusion list below as well, and come out again once they are
# older than the gate.
minimumReleaseAge: 4320

# Exclude trusted packages from the age gate
minimumReleaseAgeExclude:
  - "@mheob/*"

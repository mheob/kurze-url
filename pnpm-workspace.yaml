packages:
  - apps/web
  - packages/*

allowBuilds:
  better-sqlite3: true
  esbuild: true
  lefthook: true
  lightningcss: true
  # No-op here: its postinstall only runs `msw init` when package.json has a
  # `msw.workerDirectory` entry (browser mock service worker setup), which this
  # project doesn't add — only `msw/node`'s setupServer is used in tests.
  msw: true

overrides:
  # `@hey-api/json-schema-ref-parser` pins js-yaml 4.2.0, which carries two high-severity
  # advisories (GHSA-52cp-r559-cp3m, GHSA-5p4m-2wfm-xmqj) fixed in 4.3.1. Nothing else in the
  # tree is on 4.2.0 — the rest already resolve to 4.3.2 — so this only pulls that one
  # dependency forward onto the version everything else uses. Drop it once the parent bumps,
  # together with the Renovate rule in .github/renovate.json that keeps it below 5.
  js-yaml@4.2.0: ^4.3.2

  # Unrelated to js-yaml: whatever range a dependency asks for, `vite` and `vitest` resolve
  # to the catalog's pins below, so the tree holds exactly one Vite+ core and one Vitest.
  # That includes the ranges `vite-plus` itself declares, which is why a catalog entry that
  # drifts from them installs without a warning; CI's `check:vite-plus` step fails on it
  # instead (see the comment above `catalog:`).
  vite@*: "catalog:"
  vitest@*: "catalog:"

  # `@types/pg` and `@types/set-cookie-parser` ask for `@types/node` as `*`, which resolves
  # to the newest major. This keeps every copy on the catalog's major, the Node the code runs
  # on (`.node-version`, and Vercel's `24.x`), so no type describes an API the runtime lacks.
  "@types/node@*": "catalog:"

# No `minimumReleaseAge` here on purpose: since 2026-10-17 this repository uses
# pnpm's own default, one day, which pnpm applies non-strictly — when no
# matching version is old enough, it falls back to a younger one rather than
# failing the install. The explicit three days set on 2026-09-25 matched the
# Renovate preset's window (`security:minimumReleaseAgeNpm`); Renovate itself
# still waits that long.
#
# Exclude trusted packages from the age gate.
minimumReleaseAgeExclude:
  - "@mheob/*"

# How `pnpm add` uses the catalog below: `strict` only allows a dependency's catalog version,
# and adding one outside the catalog's range fails. It governs `pnpm add` only.
catalogMode: strict

# Every dependency's version lives here; the package.json files refer to it as `catalog:`.
#
# The `vite`, `vitest`, `vite-plus` and `@vitest/browser-playwright` entries must stay at
# exactly the versions `vite-plus` declares: `dependencies.vite` (as Vite+ core),
# `dependencies.vitest` and `peerDependencies["@vitest/browser-playwright"]` in its
# package.json. The `vite@*` and `vitest@*` overrides above force the catalog's versions
# onto `vite-plus`'s own dependencies, so a mismatch installs silently instead of failing:
# a lone `vitest` bump sits next to `vite-plus`'s own `@vitest/*` packages at the version
# it shipped with. Renovate groups the four into one pull request (.github/renovate.json)
# when they release together, but cannot guarantee it, because Vitest publishes patches
# before `vite-plus` re-pins them. CI's `check:vite-plus` step
# (scripts/check-vite-plus-versions.ts) fails such a pull request: after `pnpm install` it
# compares the installed `vite`, `vitest` and `@vitest/browser-playwright` with what
# `vite-plus` declares.
catalog:
  "@axe-core/playwright": ^4.14.0
  "@base-ui/react": ^1.9.0
  "@fontsource-variable/geist": ^5.3.0
  "@fontsource-variable/geist-mono": ^5.3.0
  "@hey-api/openapi-ts": ^0.99.0
  "@mheob/oxfmt-config": ^1.3.3
  "@mheob/oxlint-config": ^4.1.2
  "@playwright/test": ^1.65.0
  "@sentry/tanstackstart-react": ^11.12.0
  "@storybook/addon-a11y": ^10.6.7
  "@storybook/addon-vitest": ^10.6.7
  "@storybook/tanstack-react": ^10.6.7
  "@supabase/ssr": ^0.12.7
  "@supabase/supabase-js": ^2.119.0
  "@tailwindcss/vite": ^4.3.5
  "@tanstack/devtools-vite": ^0.8.6
  "@tanstack/react-devtools": ^0.10.14
  "@tanstack/react-form": ^1.33.5
  "@tanstack/react-query": ^5.107.1
  "@tanstack/react-router": ^1.170.46
  "@tanstack/react-router-devtools": ^1.167.3
  "@tanstack/react-router-ssr-query": ^1.167.3
  "@tanstack/react-start": ^1.169.5
  "@testing-library/jest-dom": ^7.0.1
  "@testing-library/react": ^16.3.3
  "@testing-library/user-event": ^14.6.9
  "@types/node": ^24.19.2
  "@types/pg": ^8.23.1
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vercel/related-projects": ^1.1.1
  "@vitejs/plugin-react": ^6.3.0
  "@vitest/browser-playwright": 5.1.0
  axe-core: ^4.14.0
  class-variance-authority: ^0.7.1
  cn: ^0.5.2
  cve-lite-cli: ^1.41.1
  date-fns: ^4.4.0
  eslint-plugin-better-tailwindcss: ^4.11.0
  eslint-plugin-jsonc: ^3.4.2
  eslint-plugin-regexp: ^3.3.3
  eslint-plugin-storybook: ^10.6.7
  eslint-plugin-yml: ^3.10.0
  i18next: ^26.7.2
  jsdom: ^30.1.3
  lefthook: ^2.2.2
  lucide-react: ^1.72.0
  msw: ^3.0.5
  # Exact on purpose: Nitro 3 ships as date-stamped betas, and each one may break.
  nitro: 3.0.260903-beta
  pg: ^8.23.1
  react: ^19.3.1
  react-day-picker: ^10.0.2
  react-dom: ^19.3.1
  react-i18next: ^17.1.13
  recharts: 3.10.1
  shadcn: ^4.23.0
  storybook: ^10.6.7
  tailwindcss: ^4.3.5
  tw-animate-css: ^1.4.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0
  vite-plus: 1.5.0
  vitest: 5.1.0

# The `typescript6` catalog is used by `packages/api-client` alone: its generator,
# `@hey-api/openapi-ts`, crashes on the TypeScript 7 that the default catalog carries
# (CLAUDE.md). Renovate caps this entry below 7 (.github/renovate.json).
catalogs:
  typescript6:
    typescript: ^6.0.3

# Vite+ core is a 1.x release standing in for `vite`, so it sits outside the `vite` ranges
# plugins declare as peers and pnpm would flag each of them as an unmet peer. `vitest` is
# allowed the same way, so the Vitest that Vite+ bundles satisfies whatever a peer asks for.
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

packages:
  - apps/web
  - packages/*

allowBuilds:
  # Stays false, and the source-map upload works anyway: @sentry/cli ships its
  # binary through platform-specific optional dependencies, which are in the
  # lockfile and are installed like any other package. Its postinstall script
  # is only a fallback that downloads the binary when no matching optional
  # dependency exists — a case this repo's supported platforms do not hit.
  # Allowing it would buy nothing and hand an install-time network fetch a
  # postinstall script it does not need. If a source-map upload ever fails,
  # this flag is not the cause; look at SENTRY_AUTH_TOKEN and the org/project
  # settings in apps/web/vite.config.ts first.
  "@sentry/cli": false
  better-sqlite3: true
  esbuild: true
  lefthook: true
  lightningcss: true
  # No-op here: its postinstall only runs `msw init` when package.json has a
  # `msw.workerDirectory` entry (browser mock service worker setup), which this
  # project doesn't add — only `msw/node`'s setupServer is used in tests.
  msw: true

# `@hey-api/json-schema-ref-parser` pins js-yaml 4.2.0, which carries two high-severity
# advisories (GHSA-52cp-r559-cp3m, GHSA-5p4m-2wfm-xmqj) fixed in 4.3.1. Nothing else in the
# tree is on 4.2.0 — the rest already resolve to 4.3.2 — so this only pulls that one
# dependency forward onto the version everything else uses. Drop it once the parent bumps.
overrides:
  js-yaml@4.2.0: ^4.3.2

# Exclude trusted packages from the age gate
minimumReleaseAgeExclude:
  - "@mheob/*"

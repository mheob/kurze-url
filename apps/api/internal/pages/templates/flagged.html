<!doctype html>
<html lang="{{ .Lang }}">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<title>{{ .Title }}</title>
		<style>
			:root {
				color-scheme: light dark;
			}
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				font:
					16px/1.5 system-ui,
					sans-serif;
				padding: 1.5rem;
			}
			main {
				max-width: 36rem;
			}
			h1 {
				font-size: 1.5rem;
				margin: 0 0 0.5rem;
			}
			p {
				margin: 0 0 0.75rem;
			}
			ul {
				margin: 0 0 0.75rem;
				padding-left: 1.25rem;
			}
			a {
				color: inherit;
				text-decoration: underline;
				text-underline-offset: 0.2em;
			}
			.disclaimer {
				font-size: 0.875rem;
			}
		</style>
	</head>
	<body>
		<main>
			<h1>{{ .Heading }}</h1>
			<p>{{ .Lead }}</p>
			{{ range .Threats }}
			<p>{{ .Body }}</p>
			<ul>
				{{ range .Definitions }}
				<li><a href="{{ .URL }}" rel="noreferrer">{{ .Label }}</a></li>
				{{ end }}
			</ul>
			{{ end }}
			<p><a href="{{ .AdvisoryURL }}" rel="noreferrer">{{ .Advisory }}</a></p>
			<p class="disclaimer">{{ .Disclaimer }}</p>
		</main>
	</body>
</html>

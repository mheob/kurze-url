version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - misspell
    - nilerr
    - revive
    - sqlclosecheck
    - unconvert
  exclusions:
    rules:
      # Generated by sqlc; not ours to lint.
      - path: internal/db/
        linters:
          - revive
          - unused

formatters:
  enable:
    - gofmt
    - goimports

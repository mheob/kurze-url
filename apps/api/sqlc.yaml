version: "2"
sql:
  - engine: postgresql
    schema:
      - internal/db/schema
      - ../../supabase/migrations
    queries: internal/db/queries
    gen:
      go:
        package: db
        out: internal/db
        sql_package: pgx/v5
        emit_json_tags: false
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        rename:
          destination_url: DestinationURL
          qr_logo_url: QRLogoURL
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          # Without these, sqlc's pgx/v5 mapping yields pgtype.Date and the
          # rollup's bucket_start would not be a time.Time.
          - db_type: date
            go_type: time.Time
          - db_type: date
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          # Without these, nullable/non-null timestamptz columns (e.g.
          # link.expires_at) generate as pgtype.Timestamptz instead of
          # (*)time.Time.
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          # audit_log.metadata is jsonb, which sqlc's pgx/v5 mapping generates
          # as []byte by default. That is fine for reads, but production
          # connects through Supavisor's transaction pooler, which forces
          # pgx.QueryExecModeExec on the pool (see cmd/api/main.go). In that
          # mode pgx never gets a server-described parameter type, so it picks
          # a wire encoding from the Go argument's own type alone: a []byte
          # value is encoded as Postgres bytea, and Postgres then rejects it
          # for a jsonb column with "invalid input syntax for type json"
          # (SQLSTATE 22P02) — a plain string is encoded as text instead,
          # which Postgres parses correctly as jsonb. A per-query ::text cast
          # cannot fix this instead: it would make sqlc infer the same string
          # type, but Postgres has no cast from text to jsonb, so the insert
          # would fail to plan at all. Scoped to this one column rather than
          # every jsonb column, so link_scan_result.raw_response (unused by
          # any query yet) is untouched until it needs the same treatment.
          - column: audit_log.metadata
            nullable: true
            go_type:
              type: string
              pointer: true

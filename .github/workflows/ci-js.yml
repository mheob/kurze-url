name: CI — JS/TS

# The workspace currently holds only root tooling; apps/web and
# packages/api-client join these checks automatically as they land.
on:
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/**"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.js"
      - "**/*.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/ci-js.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.js"
      - "**/*.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/ci-js.yml"

concurrency:
  group: ci-js-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: format, lint & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # oxfmt and oxlint, not Prettier/ESLint — see the @mheob shared configs
      # in package.json.
      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

name: CI — JS/TS

# Deliberately NOT filtered with `on.paths` — see the note in ci-api.yml. A
# workflow that never triggers produces no check run, which permanently blocks
# a PR if that check is required.
#
# The workspace currently holds only root tooling; apps/web and
# packages/api-client join these checks automatically as they land.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-js-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      js: ${{ steps.filter.outputs.js }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Fail towards running the checks when the base is unknown.
          if [ -z "$BASE_SHA" ] \
            || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "js=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # oxfmt also formats Markdown, JSON and YAML, so the format check is
          # relevant well beyond the TypeScript sources.
          if git diff --name-only "$BASE_SHA" HEAD \
            | grep -qE '(\.(ts|tsx|js|jsx|json|md|ya?ml)$|^pnpm-lock\.yaml$|^pnpm-workspace\.yaml$|^apps/web/|^packages/)'; then
            echo "js=true" >> "$GITHUB_OUTPUT"
          else
            echo "js=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: format, lint & typecheck
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # oxfmt and oxlint, not Prettier/ESLint — see the @mheob shared configs
      # in package.json.
      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

name: CI — API

# Deliberately NOT filtered with `on.paths`. A workflow that does not trigger
# produces no check run at all, so a required status check would wait forever
# on a PR that happens to touch nothing here. Instead this always runs and the
# expensive jobs skip themselves: a job skipped by `if:` still reports, and
# GitHub counts a skipped job as satisfying a required check.
#
# apps/api is Go, so it sits outside the pnpm workspace graph and its change
# detection is written by hand rather than inferred from the lockfile.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-api-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: detect changes (api)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Fail towards running the suite: if the base is unknown (first push
          # to a branch, a force push, the all-zero sha), test rather than skip.
          if [ -z "$BASE_SHA" ] \
            || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "api=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "$BASE_SHA" HEAD \
            | grep -qE '^(apps/api/|supabase/|\.github/workflows/ci-api\.yml$)'; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=false" >> "$GITHUB_OUTPUT"
          fi

  static:
    name: vet & lint
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          working-directory: apps/api

  test:
    name: go test
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    # supabase start pulls several container images on a cold runner.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: latest

      # Brings up Postgres with auth.users, applies every migration and loads
      # supabase/seed.sql. The db and api tests resolve the seeded short.test
      # link; the cache and api tests start their own Redis via testcontainers,
      # which uses the runner's Docker daemon.
      - name: Start the local Supabase stack
        working-directory: .
        run: supabase start

      - name: go test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:54322/postgres
        run: go test ./... -count=1

      # internal/analytics is the only package with real concurrency: an
      # unguarded buffer there corrupts click counts silently rather than
      # failing loudly.
      - name: go test -race (analytics, api)
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:54322/postgres
        run: go test -race ./internal/analytics/... ./internal/api/... -count=1

      - name: Stop the local Supabase stack
        if: always()
        working-directory: .
        run: supabase stop --no-backup

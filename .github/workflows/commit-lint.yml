name: Commit messages

# Conventional Commits, checked but deliberately not a hard merge blocker yet
# (see docs/planning/07-repo-structure-and-tooling.md): cheap to adopt now so
# automated changelogs work later, without adding friction for a small,
# informal contributor base. Tighten by making this a required status check
# once there are real external contributors.
on:
  pull_request:

concurrency:
  group: commit-lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conventional:
    name: Conventional Commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check each commit on this PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'
          failed=0

          while IFS= read -r line; do
            [ -z "$line" ] && continue
            sha=${line%% *}
            subject=${line#* }

            # Merge commits are generated by the forge, not authored.
            if [ "$(git rev-list --parents -n 1 "$sha" | wc -w)" -gt 2 ]; then
              continue
            fi

            if printf '%s' "$subject" | grep -Eq "$pattern"; then
              echo "ok   $sha $subject"
            else
              echo "FAIL $sha $subject"
              failed=1
            fi
          done < <(git log --no-merges --format='%H %s' "$BASE_SHA".."$HEAD_SHA")

          if [ "$failed" -ne 0 ]; then
            echo
            echo "Expected: <type>[(scope)][!]: <description>"
            echo "Types: feat fix docs style refactor perf test build ci chore revert"
            exit 1
          fi

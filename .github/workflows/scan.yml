# The manual way into the API's Safe Browsing sweep. The schedule lives in
# apps/api/vercel.json since 2026-11-16: Vercel Cron calls GET /internal/scan
# at :07 and :37 every hour with CRON_SECRET. This workflow had that job until
# GitHub, from 2026-11-01, started only three or four of its 48 scheduled runs
# a day, with gaps up to ten and a half hours — every run that did start
# succeeded, but the heartbeat cannot tell a dropped run from a dead sweep.
#
# Run it from the Actions tab or with `gh workflow run scan.yml` when a sweep
# should not wait for the next half hour, say right after a deploy. It calls
# the same sweep with SCAN_TOKEN instead of CRON_SECRET. A successful sweep
# pings the Better Stack heartbeat from inside the API, whoever asked for it,
# so this workflow pings nothing itself.
#
# Worth knowing when reading the output: a large "remaining" after a deploy is
# expected, the sweep drains its backlog 200 links at a time, and so is a run
# that stops at its 25-second budget with links left over — that still answers
# 200. "remaining" also never reaches zero while any link is flagged, because a
# flagged link is due on every sweep. A 502 means Google did not answer and
# nothing was written; a 503 means SAFE_BROWSING_API_KEY is unset on the API.
name: scan

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/scan.yml

concurrency:
  group: scan
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Skipped on pull requests: this calls production, and an unmerged
      # branch must not be able to flag or unflag production links. On a pull
      # request the job therefore only proves the file parses, which is what
      # the path filter above is for.
      - name: Check due links against Safe Browsing
        if: github.event_name != 'pull_request'
        env:
          SCAN_TOKEN: ${{ secrets.SCAN_TOKEN }}
        run: |
          if [ -z "$SCAN_TOKEN" ]; then
            echo "SCAN_TOKEN is not set" >&2
            exit 1
          fi
          curl --fail --silent --show-error --max-time 60 \
            --request POST \
            --header "X-Scan-Token: $SCAN_TOKEN" \
            https://api.kurze-url.app/internal/scan
          echo
